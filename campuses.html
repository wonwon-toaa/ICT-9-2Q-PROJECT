<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Drill 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <style>
        .container.pt-5 {
        text-align: center;
        margin-bottom: 20px;
        background-color: #ededed;
        font-family: Gill sans-serif, sans-serif; 
        
        }
        .col-3.p-3.border.rounded.bg-white.vh-50 {
        border-color: #030827; 


        }
        .border.rounded {
        transition:all 0.3s ease-in-out;
        }


        .border.rounded:hover {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
            cursor:pointer;
        }
    </style>
</head>
<body> 
    <div class="container pt-5">
         <img src="logo obmc.png" alt="OBMC Logo" class="main-logo" style="width: 150px; height: 150px;">
        <div class="row gap-4 justify-content-center">  
            <div class="col-3 p-3 border rounded bg-white vh-50">
                <h5>Sta. Ana</h5>
                <img src="Sta Ana.jpg" alt="Sta. Ana" class="img-fluid">
            </div>


            <div class="col-3 p-3 border rounded bg-white vh-50">
                <h5>Angeles</h5>
                <img src="Angeles .jpg" alt="Angeles" class="img-fluid">
            </div>


            <div class="col-3 p-3 border rounded bg-white vh-50">
                <h5>Las Pinas</h5>
                <img src="Las Pinas.jpg" alt="Las Pinas" class="img-fluid">
            </div>


            <div class="col-3 p-3 border rounded bg-white vh-50">
                <h5>Green Hills</h5>
                <img src="Green Hills.jpg" alt="Green Hills" class="img-fluid">
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
