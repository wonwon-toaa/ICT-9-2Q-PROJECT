    <style>
 * {
    margin: 0;

 }


       
.hero-viewport {
    min-height: 100vh;
    width: 100%;
    background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.6)), url('banner.png');
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
     display: flex;
    align-items: flex-end; 
    justify-content: flex-start;
    }


.hero-text-block {
    max-width: 800px;
    padding: 0 0 6% 6%; 
    color: #ffffff;
}


.hero-text-block h1 {
    font-size: 54px;
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 10px;
    letter-spacing: -0.5px;
}


.hero-text-block h2 {
    font-size: 22px;
    font-weight: 600;
    color: #ffdd80;
    margin-bottom: 20px;
    letter-spacing: 1px;
    }




.hero-text-block p {
    font-size: 16px;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.9);
    margin-bottom: 30px;
    }


.cta-action-btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    background-color: #006A4E; 
    color: #ffffff;
    padding: 14px 32px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 50px;
    transition: background-color 0.2s ease;
    }


.btn-arrow-icon {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    }

</head>
