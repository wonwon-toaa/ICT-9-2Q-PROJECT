<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <style>
    :root {
      --primary-blue: #00356E;
      --accent-green: #5DA709;
      --green-hover: #427a01;
      --bg-light: #f0f9ff;
      --white: #ffffff;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

    body {
      background:#00356E
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .contact-container {
      background: var(--white);
      max-width: 900px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(15, 76, 129, 0.1), 0 8px 10px -6px rgba(15, 76, 129, 0.05);
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      overflow: hidden;
    }

    .contact-info {
      background:#00356E;
      color: var(--white);
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .contact-info h2 {
      font-size: 28px;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .contact-info p {
      font-size: 15px;
      line-height: 1.6;
      color: #e2e8f0;
      margin-bottom: 30px;
    }

    .info-details {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }


    .info-item {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 15px;
    }

    .icon-badge {
      background: rgba(255, 255, 255, 0.15);
      color: var(--accent-green);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }



    .contact-form {
      padding: 40px;
    }

    .contact-form h3 {
      color: var(--primary-blue);
      font-size: 22px;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-dark);
    }

    input, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      font-size: 15px;
      color: var(--text-dark);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-green);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    button {
      background-color: var(--accent-green);
      color: var(--white);
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--green-hover);
    }

    button:active {
      transform: scale(0.99);
    }

    @media (max-width: 768px) {
      .contact-container {
        grid-template-columns: 1fr;
      }
      .contact-info, .contact-form {
        padding: 30px;

      }
    }
  </style>
</head>
<body>

  <div class="contact-container">
    <div class="contact-info">
      <div>
        <h2>Get in Touch</h2>
        <p>Message us and our team will respond in less than 24 hours to assist you.</p>
        
        <div class="info-details">
          <div class="info-item">
            <div class="icon-badge">✉</div>
            <span>info@obmontessori.edu.ph</span>
          </div>
          <div class="info-item">
            <div class="icon-badge">☎</div>
            <span>+63 936 098 2170 / +63 921 325 1838</span>
          </div>
          <div class="info-item">
            <div class="icon-badge">📍</div>
            <span>Greenhills, Las Pinas, Sta. Ana, Angeles</span>
          </div>
        </div>
      </div>
    </div>


    <div class="contact-form">
      <h3>Send us a Message</h3>
      <form action="#" method="POST">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Miyah Florhezs" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="florehzs.m@gmail.com" required>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" placeholder="How can we help?" required>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
        </div>

        <button type="submit">Send Message</button>
      </form>
    </div>
  </div>

</body>
</html>
